# Netlify build settings. The Next.js app lives in frontend/, so the build runs
# from there; Netlify's Next.js runtime is detected automatically.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly: without it the build only uploaded static files and
# created no server function, so every page returned Netlify's 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
